<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Login - Library</title>
    <style>
        body { font-family: Arial, sans-serif; max-width:600px; margin:40px auto; }
        .card { border:1px solid #ddd; padding:20px; border-radius:6px; }
        input { width:100%; padding:8px; margin:8px 0; box-sizing:border-box; }
        button { padding:8px 12px; }
        .error { color: #721c24; background:#f8d7da; padding:8px; border-radius:4px; display:none; }
    </style>
</head>
<body>
<div class="card">
    <h1>Library Login</h1>
    <p>Please enter your username and password:</p>
    <div id="error" class="error"></div>

    <input id="username" placeholder="Username" />
    <input id="password" placeholder="Password" type="password" />
    <button id="loginBtn">Login</button>
</div>

<script>
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const errorBox = document.getElementById('error');
    const loginBtn = document.getElementById('loginBtn');

    async function doLogin() {
      const u = username.value.trim();
      const p = password.value;
      if (!u || !p) {
        showError('Please enter username and password');
        return;
      }
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username: u, password: p })
        });
        if (res.ok) {
          // go to main page
          window.location.href = '/index.html';
        } else {
          const data = await res.json();
          showError(data.message || 'Login failed');
        }
      } catch (e) {
        showError('Network error');
      }
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      setTimeout(() => { errorBox.style.display = 'none'; }, 3500);
    }

    loginBtn.addEventListener('click', doLogin);
    [username, password].forEach(i => i.addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); }));
</script>
</body>
</html>
